<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="apple-touch-icon" href="icon.PNG">
    <link rel="icon" type="image/png" sizes="192x192" href="icon.PNG">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>買不完的OY</title>
    <style>
        :root { 
            --primary: #f05a28; --secondary: #27ae60; --bg: #f8f9fa; --card-bg: #ffffff;
            --cart: #27ae60; --plan: #8e44ad; --calc: #2980b9; --price-hist: #e67e22;
            --gray: #8e8e93; --light-gray: #f2f2f7; --sale: #eb4d4b; 
            --shadow: 0 8px 24px rgba(0,0,0,0.05); --radius: 16px;
            --pri-must: #eb4d4b; --pri-need: #f39c12; --pri-want: #3498db;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); margin: 0; padding: 10px 10px 240px 10px; color: #2c3e50; line-height: 1.4; font-size: 14px; 
        }
        
        input, textarea, select { -webkit-user-select: text !important; user-select: text !important; caret-color: var(--primary); }
        body { -webkit-touch-callout: none; }

        .nav-tabs { 
            display: flex; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); 
            border-radius: 20px; margin-bottom: 15px; padding: 6px; position: sticky; top: 10px; 
            z-index: 1000; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.5);
        }
        .nav-btn { flex: 1; padding: 12px 2px; border: none; background: none; font-weight: 600; color: var(--gray); border-radius: 15px; font-size: 11px; transition: 0.2s; }
        .nav-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(240, 90, 40, 0.2); }

        .card { background: var(--card-bg); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 15px; border: 1px solid rgba(0,0,0,0.02); }

        .chip-group-label { font-size: 11px; color: var(--gray); font-weight: 700; margin: 15px 0 8px 5px; display: block; text-transform: uppercase; }
        .chip-container { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; margin-bottom: 12px; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
        .chip-container::-webkit-scrollbar { display: none; }
        .filter-chip { white-space: nowrap; padding: 8px 16px; border-radius: 12px; background: #fff; border: 1px solid #e5e5ea; font-size: 13px; color: #444; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: 600; }
        .filter-chip.sub.active { background: var(--secondary); border-color: var(--secondary); }

        .item-card { display: flex; gap: 14px; align-items: center; }
        .prod-img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; background: #eee; flex-shrink: 0; }
        .price-tag { background: #f8f9fa; padding: 6px 10px; border-radius: 8px; margin-top: 6px; border: 1px solid #f1f1f1; }
        .sale-price { color: var(--sale); font-weight: 700; font-size: 14px; }
        .origin-price { color: var(--gray); text-decoration: line-through; margin-right: 5px; font-size: 11px; }
        
        input, select { width: 100%; height: 44px; padding: 10px 14px; border: 1px solid #e5e5ea; border-radius: 12px; margin-bottom: 10px; font-size: 14px; background: #fff; }
        .btn-main { background: var(--primary); color: white; padding: 14px; border: none; border-radius: 14px; width: 100%; font-weight: 700; font-size: 15px; }
        
        .qty-ctrl { display: flex; align-items: center; gap: 5px; background: #f2f2f7; border-radius: 10px; padding: 3px; }
        .qty-btn { width: 30px; height: 30px; border: none; background: white; border-radius: 8px; font-weight: bold; }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .checkout-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); padding: 15px 20px 35px 20px; border-top: 1px solid rgba(0,0,0,0.05); z-index: 1500; }
        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index:2000; align-items:center; justify-content:center; padding: 20px; }
        .modal-content { background:white; padding:24px; border-radius:24px; width:100%; max-width:400px; max-height: 85vh; overflow-y: auto; }
        
        /* 歷史價格小標籤 */
        .hist-tag { font-size: 10px; background: #fff3e0; color: #e67e22; padding: 2px 6px; border-radius: 4px; margin-left: 5px; border: 1px solid #ffe0b2; }
    </style>
</head>
<body>

<div class="nav-tabs">
    <button class="nav-btn active" onclick="switchPage('wishlist', this)">✚ 登記</button>
    <button class="nav-btn" onclick="switchPage('dashboard', this)">📋 清單</button>
    <button class="nav-btn" onclick="switchPage('quickcalc', this)">⚡ 速算</button>
    <button class="nav-btn" onclick="switchPage('pricehistory', this)">📉 比價</button>
    <button class="nav-btn" onclick="switchPage('plan', this)">📝 計畫</button>
    <button class="nav-btn" onclick="switchPage('cart', this)">🛒 籃子</button>
</div>

<div class="card" style="background: #f1f2f6; border: 1px dashed #ccc; margin-top: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-weight: bold; color: #57606f;">💾 系統管理 (備份/重置)</span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
        <button onclick="exportData()" style="padding: 8px; border-radius: 8px; border: 1px solid #2f3542; background: white; font-size: 12px;">📤 匯出備份</button>
        <button onclick="document.getElementById('importFile').click()" style="padding: 8px; border-radius: 8px; border: 1px solid #2f3542; background: white; font-size: 12px;">📥 匯入紀錄</button>
        <button onclick="hardResetSystem()" style="padding: 8px; border-radius: 8px; border: 1px solid #eb4d4b; background: #fff2f2; color: #eb4d4b; font-size: 12px; font-weight: bold;">⚠️ 重置系統</button>
    </div>
    <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
</div>

<div id="wishlist-page" class="page active">
    <div class="card" style="background: #fffef0; border: 1px solid #f9f0c5;">
        <span class="small-label" style="color: #a08c2a;">💰 當前匯率 (KRW ➔ HKD)</span>
        <div style="display:flex; gap:10px; align-items:center;">
            <input type="number" id="rateInput" step="0.0001" onchange="saveRate()" style="margin:0; flex:1; height: 38px; font-weight: bold;">
            <span style="font-weight:700; color:var(--primary);">1萬₩ ≈ $<span id="rateExample">--</span></span>
        </div>
    </div>
    
    <div class="card" id="reg-form-card">
        <h3 id="regTitle">✨ 登記新產品</h3>
        <input type="hidden" id="edit-id">
        <input type="text" id="name" placeholder="產品名稱 (必填)">
        <input type="text" id="imgUrl" placeholder="圖片連結 (選填)">
        <span class="chip-group-label">主/子分類</span>
        <div class="chip-container" id="regMainCatChips"></div>
        <div class="chip-container" id="regSubCatChips"></div>
        <span class="chip-group-label">優先級</span>
        <div class="chip-container" id="regPriChips"></div>
        <div id="specContainer" style="margin-top: 10px;"></div>
        <button onclick="addSpecRow()" style="width:100%; border:1px dashed var(--primary); background:none; color:var(--primary); padding:10px; border-radius:12px; margin-bottom:15px;">+ 新增規格</button>
        <button class="btn-main" id="saveBtn" onclick="saveProduct()">存入我的清單</button>
        <button class="btn-main" id="cancelEditBtn" style="display:none; background:#eee; color:#333; margin-top:10px;" onclick="cancelEdit()">取消編輯</button>
    </div>
</div>

<div id="dashboard-page" class="page">
    <div style="padding: 10px 0; position: sticky; top: 75px; background: var(--bg); z-index: 998;">
        <div id="mainTabScroll" class="chip-container"></div>
        <div id="subTabScroll" class="chip-container"></div>
        <div id="priTabScroll" class="chip-container"></div>
        <input type="text" id="searchBar" placeholder="🔍 搜尋產品..." oninput="render()" style="box-shadow: var(--shadow); border:none;">
    </div>
    <div id="dash-list"></div>
</div>

<div id="quickcalc-page" class="page">
    <div class="card" style="background: linear-gradient(135deg, #e3f2fd 0%, #ffffff 100%);">
        <h3 style="color:var(--calc);">⚡ 現場速算</h3>
        <div id="quick-calc-list"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
            <button onclick="addQuickManualItem()" style="height:44px; border-radius:12px; border:1px solid var(--calc); background:white; color:var(--calc); font-weight:600;">+ 手動項目</button>
            <button onclick="openQuickProdPicker()" style="height:44px; border-radius:12px; border:none; background:var(--calc); color:white; font-weight:600;">+ 選產品</button>
        </div>
    </div>
    <div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>總計:</span><b id="quick-total-won">₩0</b></div>
        <div style="display:flex; justify-content:space-between; color:var(--cart); margin-bottom:8px;"><span>退稅:</span><b id="quick-refund-won">₩0</b></div>
        <hr style="border:0; border-top:1px solid #eee; margin: 10px 0;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:700;">實付金額:</span>
            <div style="text-align:right;">
                <div style="font-size:20px; font-weight:900; color:var(--primary);">₩<span id="quick-final-won">0</span></div>
                <div style="color:var(--gray); font-size:12px;">≈ HKD $<span id="quick-final-hkd">0</span></div>
            </div>
        </div>
        <button style="width:100%; margin-top:15px; color:#999; border:none; background:none; font-size:12px;" onclick="clearQuickCalc()">🗑️ 清空速算</button>
    </div>
</div>

<div id="pricehistory-page" class="page">
    <div class="card" style="background: #fff3e0; border: 1px solid #ffe0b2;">
        <h3 style="color:var(--price-hist); margin-top:0;">📉 歷史價格追蹤</h3>
        <p style="font-size:12px; color:#666;">記錄產品在不同地點或時間的價格，方便比價。</p>
        <button class="btn-main" style="background:var(--price-hist);" onclick="openPriceRecordModal()">+ 新增比價記錄</button>
    </div>
    <div id="price-history-list"></div>
</div>

<div id="plan-page" class="page">
    <div class="card" style="text-align:center; background: #f3e5f5; border:none;">
        <button class="btn-main" style="background:var(--plan); width:auto; padding:10px 25px;" onclick="createNewPlanGroup()">➕ 創建新計畫</button>
    </div>
    <div id="plan-groups"></div>
</div>

<div id="cart-page" class="page">
    <div id="cart-list"></div>
    <div class="card" style="margin-top:20px; border-top:4px solid var(--secondary);">
        <h3 style="color:#2d5a27;">📜 購買紀錄</h3>
        <div id="history-list"></div>
    </div>
</div>

<div class="checkout-bar">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div>
            <div style="font-size: 11px; color: var(--gray);">總計: <span id="cart-total">₩0</span></div>
            <div style="color:var(--primary); font-weight:900; font-size:22px;">實付: ₩<span id="after-refund-total">0</span></div>
        </div>
        <div style="text-align:right;">
            <div id="tax-refund-display" style="font-weight:700; color:var(--cart); font-size:13px;">退稅: ₩0</div>
            <div style="font-size:12px; color:var(--gray); margin-top:4px;">≈ HKD $<span id="hkd-total">0</span></div>
        </div>
    </div>
    <button class="btn-main" style="background:var(--cart);" onclick="checkoutCart()">✅ 完成購買並存入紀錄</button>
</div>

<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-content" id="priceRecordModal" style="display:none;">
        <h3 id="priceModalTitle">新增價格記錄</h3>
        <input type="hidden" id="edit-price-idx">
        <label class="small-label">選擇產品：</label>
        <select id="priceProdSelect" onchange="updatePriceSpecSelect()"></select>
        <label class="small-label">規格：</label>
        <select id="priceSpecSelect"></select>
        <label class="small-label">記錄價格 (₩)：</label>
        <input type="number" id="recordWon" placeholder="例如：15000">
        <label class="small-label">地點/備註：</label>
        <input type="text" id="recordNote" placeholder="例如：明洞旗艦店 / 買一送一">
        <label class="small-label">日期：</label>
        <input type="date" id="recordDate">
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-main" style="background:#eee; color:#333; flex:1;" onclick="closeModal()">取消</button>
            <button class="btn-main" style="flex:2; background:var(--price-hist);" onclick="savePriceRecord()">儲存記錄</button>
        </div>
    </div>

    <div class="modal-content" id="selectorModal" style="display:none;">
        <h4 id="modalProdName" style="margin-top:0;"></h4>
        <span class="small-label">選擇規格：</span>
        <select id="modalSpecSelect"></select>
        <div style="display:flex; align-items:center; justify-content:center; gap:30px; margin: 20px 0;">
            <button class="qty-btn" onclick="adjModalQty(-1)">-</button>
            <b id="modalQtyDisplay" style="font-size:24px;">1</b>
            <button class="qty-btn" onclick="adjModalQty(1)">+</button>
        </div>
        <button class="btn-main" id="modalConfirmBtn">確認加入</button>
    </div>
    <div class="modal-content" id="planPickerModal" style="display:none;">
        <h3>選擇要加入的計畫</h3>
        <div id="planOptionsList" style="display:flex; flex-direction:column; gap:10px;"></div>
        <button class="btn-main" style="background:#eee; color:#333; margin-top:15px;" onclick="closeModal()">取消</button>
    </div>
    <div class="modal-content" id="historyDetailModal" style="display:none;">
        <h3 id="histDetailTitle">紀錄詳情</h3>
        <input type="text" id="editHistName" style="font-weight:700;">
        <div id="histDetailItems" style="max-height:300px; overflow-y:auto; margin:10px 0;"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <input type="number" id="editHistTotal" oninput="recalcHistPaid()">
            <input type="number" id="editHistRefund" oninput="recalcHistPaid()">
        </div>
        <p>實付: ₩<span id="editHistPaid">0</span></p>
        <button class="btn-main" onclick="saveHistEdit()">儲存修改</button>
    </div>
    <div class="modal-content" id="quickPickerModal" style="display:none;">
        <h3>選取產品加入速算</h3>
        <div id="quickPickerFilters" style="background: #f8f9fa; padding: 10px; border-radius: 12px; margin-bottom: 10px;">
            <div id="qMainFilter" class="chip-container"></div>
            <input type="text" id="quickSearch" placeholder="🔍 搜尋名稱..." oninput="renderQuickPickerList()">
        </div>
        <div id="quickPickerList" style="max-height: 300px; overflow-y: auto;"></div>
        <button class="btn-main" style="background:#eee; color:#333; margin-top:15px;" onclick="closeModal()">關閉</button>
    </div>
</div>

<script>
    // 基礎數據與配置 (保留)
    const refundTable = [{min:15000,refund:1000},{min:30000,refund:2000},{min:50000,refund:3000},{min:75000,refund:5000},{min:100000,refund:7000},{min:125000,refund:8000},{min:150000,refund:9000},{min:175000,refund:10000},{min:200000,refund:12000},{min:225000,refund:13000},{min:250000,refund:15000},{min:275000,refund:17000},{min:300000,refund:19000},{min:325000,refund:21000},{min:350000,refund:23000},{min:375000,refund:25000},{min:400000,refund:27000},{min:425000,refund:28000},{min:450000,refund:30000},{min:475000,refund:32000},{min:500000,refund:35000},{min:1000000,refund:75000},{min:2000000,refund:150000}];
    const catConfig = {"護膚品":["化妝水","精華","乳液","面霜","面膜","防曬","潔面","卸妝"],"化妝品-Base":["妝前","氣墊","粉底","遮瑕","腮紅","光/陰影"],"化妝品-Eyes":["眉筆","眼線/臥蠶","眼影","睫毛膏"],"化妝品-Lip":["唇線筆","唇釉","唇膏"],"其他類":["手部膚理","身體護理","香水","零食","生活雜貨"]};

    let currentRate = parseFloat(localStorage.getItem('oy_rate')) || 0.0058;
    let db = JSON.parse(localStorage.getItem('oy_db_v18')) || [];
    let cart = JSON.parse(localStorage.getItem('oy_cart_v18')) || [];
    let historyDB = JSON.parse(localStorage.getItem('oy_history_v18')) || [];
    let planGroups = JSON.parse(localStorage.getItem('oy_plans_v18')) || [{title: "首爾必買", items: []}];
    // 新增：歷史價格數據
    let priceHistory = JSON.parse(localStorage.getItem('oy_price_hist_v18')) || [];
    
    let activeMain = "全部", activeSub = "全部", activePri = "全部";
    let regActiveMain = Object.keys(catConfig)[0], regActiveSub = catConfig[regActiveMain][0], regActivePri = "想買";
    let qActiveMain = "全部", qActivePri = "全部";
    let quickItems = [];
    let modalQty = 1;
    let currentHistIdx = null;

    // --- 歷史價格邏輯 ---
    function openPriceRecordModal(editIdx = null) {
        if(db.length === 0) return alert("請先在『登記』頁面新增產品！");
        
        document.getElementById('modalOverlay').style.display = 'flex';
        document.getElementById('priceRecordModal').style.display = 'block';
        
        const prodSelect = document.getElementById('priceProdSelect');
        prodSelect.innerHTML = db.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        
        if(editIdx !== null) {
            const h = priceHistory[editIdx];
            document.getElementById('priceModalTitle').innerText = "編輯比價記錄";
            document.getElementById('edit-price-idx').value = editIdx;
            prodSelect.value = h.prodId;
            updatePriceSpecSelect();
            document.getElementById('priceSpecSelect').value = h.specId;
            document.getElementById('recordWon').value = h.price;
            document.getElementById('recordNote').value = h.note;
            document.getElementById('recordDate').value = h.date;
        } else {
            document.getElementById('priceModalTitle').innerText = "新增比價記錄";
            document.getElementById('edit-price-idx').value = "";
            document.getElementById('recordWon').value = "";
            document.getElementById('recordNote').value = "";
            document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
            updatePriceSpecSelect();
        }
    }

    function updatePriceSpecSelect() {
        const pid = Number(document.getElementById('priceProdSelect').value);
        const p = db.find(x => x.id === pid);
        const specSelect = document.getElementById('priceSpecSelect');
        if(p) {
            specSelect.innerHTML = p.specs.map(s => `<option value="${s.specId}">${s.name}</option>`).join('');
        }
    }

    function savePriceRecord() {
        const prodId = Number(document.getElementById('priceProdSelect').value);
        const specId = Number(document.getElementById('priceSpecSelect').value);
        const price = Number(document.getElementById('recordWon').value);
        const note = document.getElementById('recordNote').value;
        const date = document.getElementById('recordDate').value;
        const editIdx = document.getElementById('edit-price-idx').value;

        if(!price) return alert("請輸入價格");

        const record = { prodId, specId, price, note, date };

        if(editIdx !== "") {
            priceHistory[editIdx] = record;
        } else {
            priceHistory.unshift(record);
        }

        localStorage.setItem('oy_price_hist_v18', JSON.stringify(priceHistory));
        closeModal();
        renderPriceHistory();
    }

    function deletePriceRecord(idx) {
        if(confirm("確定刪除此比價記錄？")) {
            priceHistory.splice(idx, 1);
            localStorage.setItem('oy_price_hist_v18', JSON.stringify(priceHistory));
            renderPriceHistory();
        }
    }

    function renderPriceHistory() {
        const cont = document.getElementById('price-history-list');
        if(priceHistory.length === 0) {
            cont.innerHTML = '<p style="text-align:center; color:#999; margin-top:30px;">尚無記錄，點擊上方按鈕開始記錄比價。</p>';
            return;
        }

        // 按產品分組顯示
        const grouped = {};
        priceHistory.forEach((h, idx) => {
            const p = db.find(x => x.id === h.prodId);
            if(!p) return;
            if(!grouped[h.prodId]) grouped[h.prodId] = { name: p.name, items: [] };
            grouped[h.prodId].items.push({ ...h, originalIdx: idx });
        });

        cont.innerHTML = Object.values(grouped).map(group => `
            <div class="card" style="border-left: 4px solid var(--price-hist);">
                <b style="font-size:16px;">${group.name}</b>
                <div style="margin-top:10px;">
                    ${group.items.sort((a,b) => new Date(b.date) - new Date(a.date)).map(item => {
                        const s = db.find(x => x.id === item.prodId)?.specs.find(x => x.specId === item.specId);
                        return `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f2f2f7;">
                            <div style="flex:1;">
                                <div style="font-weight:600;">₩${item.price.toLocaleString()} <small style="color:#666;">(${s?s.name:'預設'})</small></div>
                                <div style="font-size:11px; color:var(--gray);">${item.date} | ${item.note || '無備註'}</div>
                            </div>
                            <div style="display:flex; gap:5px;">
                                <button onclick="openPriceRecordModal(${item.originalIdx})" style="border:none; background:#f0f0f0; padding:5px 8px; border-radius:6px; font-size:11px;">編輯</button>
                                <button onclick="deletePriceRecord(${item.originalIdx})" style="border:none; background:#fff0f0; color:red; padding:5px 8px; border-radius:6px; font-size:11px;">×</button>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>
        `).join('');
    }

    // --- 以下為原有功能的邏輯 (保持不變) ---
    function exportData() {
        const data = { rate: currentRate, db: db, cart: cart, history: historyDB, plans: planGroups, priceHistory: priceHistory, exportDate: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `OY_Backup_${new Date().toLocaleDateString()}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    function importData(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (confirm("匯入將會覆蓋目前所有資料？")) {
                    currentRate = imported.rate || 0.0058; db = imported.db || []; cart = imported.cart || [];
                    historyDB = imported.history || []; planGroups = imported.plans || [];
                    priceHistory = imported.priceHistory || [];
                    saveAndRender(); location.reload();
                }
            } catch (err) { alert("格式錯誤"); }
        };
        reader.readAsText(file);
    }

    function hardResetSystem() {
        if (confirm("重置系統？")) { if (prompt("輸入 'RESET'：") === "RESET") { localStorage.clear(); location.reload(); } }
    }

    function switchPage(p, btn) {
        document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
        document.getElementById(p + '-page').classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(p === 'dashboard') initFilters();
        if(p === 'wishlist') initRegChips();
        if(p === 'pricehistory') renderPriceHistory();
        render();
    }

    // --- 產品登記邏輯 ---
    function editProduct(pid) {
        const p = db.find(x => x.id === pid); if(!p) return;
        switchPage('wishlist', document.querySelector('[onclick*="wishlist"]'));
        document.getElementById('regTitle').innerText = "✏️ 編輯產品"; document.getElementById('edit-id').value = p.id;
        document.getElementById('name').value = p.name; document.getElementById('imgUrl').value = p.img || "";
        regActiveMain = p.main; regActiveSub = p.sub; regActivePri = p.priority; initRegChips();
        const cont = document.getElementById('specContainer'); cont.innerHTML = "";
        p.specs.forEach(s => addSpecRow(s));
        document.getElementById('saveBtn').innerText = "儲存修改"; document.getElementById('cancelEditBtn').style.display = "block";
    }

    function cancelEdit() {
        document.getElementById('regTitle').innerText = "✨ 登記新產品"; document.getElementById('edit-id').value = "";
        document.getElementById('name').value = ""; document.getElementById('imgUrl').value = "";
        document.getElementById('specContainer').innerHTML = ""; addSpecRow();
        document.getElementById('saveBtn').innerText = "存入我的清單"; document.getElementById('cancelEditBtn').style.display = "none";
    }

    function saveProduct() {
        const name = document.getElementById('name').value; if(!name) return alert("請輸入名稱");
        const eid = document.getElementById('edit-id').value;
        const specs = Array.from(document.querySelectorAll('.spec-input-item')).map(c => ({ 
            specId: c.dataset.sid ? parseFloat(c.dataset.sid) : Math.random(), 
            name: c.querySelector('.s-name').value||"標準", 
            price: Number(c.querySelector('.s-price').value)||0, 
            salePrice: Number(c.querySelector('.s-sale').value)||null, 
            saleDate: c.querySelector('.s-date').value||null 
        }));
        if(eid) {
            let idx = db.findIndex(x => x.id == eid);
            db[idx] = { ...db[idx], name, img:document.getElementById('imgUrl').value, main: regActiveMain, sub: regActiveSub, priority: regActivePri, specs };
        } else {
            db.push({ id:Date.now(), name, img:document.getElementById('imgUrl').value, main: regActiveMain, sub: regActiveSub, priority: regActivePri, specs });
        }
        saveAndRender(); cancelEdit();
    }

    function addSpecRow(data = null) {
        const d = document.createElement('div'); d.className='spec-input-item'; d.style='border:1px solid #f2f2f7; padding:12px; border-radius:12px; margin-bottom:10px; position:relative;';
        if(data) d.dataset.sid = data.specId;
        d.innerHTML=`<button onclick="this.parentElement.remove()" style="position:absolute; right:5px; top:5px; border:none; background:none; color:red;">×</button>
            <input type="text" class="s-name" placeholder="規格名稱" value="${data?data.name:''}">
            <div style="display:flex; gap:8px;"><input type="number" class="s-price" placeholder="原價" value="${data?data.price:''}">
            <input type="number" class="s-sale" placeholder="特價" value="${data?data.salePrice||'':''}"></div>
            <label class="small-label" style="font-size:10px;">特價期限：</label><input type="date" class="s-date" value="${data?data.saleDate||'':''}">`;
        document.getElementById('specContainer').appendChild(d);
    }

    // --- 渲染與核心邏輯 ---
    function saveAndRender() {
        localStorage.setItem('oy_db_v18', JSON.stringify(db)); localStorage.setItem('oy_cart_v18', JSON.stringify(cart));
        localStorage.setItem('oy_plans_v18', JSON.stringify(planGroups)); localStorage.setItem('oy_history_v18', JSON.stringify(historyDB));
        localStorage.setItem('oy_rate', currentRate); render();
    }

    function render() {
        document.getElementById('rateInput').value = currentRate;
        document.getElementById('rateExample').innerText = Math.round(10000 * currentRate).toLocaleString();
        const dashCont = document.getElementById('dash-list'); dashCont.innerHTML = '';
        const sText = document.getElementById('searchBar').value.toLowerCase();
        const today = new Date().toISOString().split('T')[0];
        
        db.forEach(p => {
            if(activeMain !== '全部' && p.main !== activeMain) return;
            if(activeSub !== '全部' && p.sub !== activeSub) return;
            if(activePri !== '全部' && p.priority !== activePri) return;
            if(sText && !p.name.toLowerCase().includes(sText)) return;
            
            // 檢查是否有歷史價格
            const hasHistory = priceHistory.some(h => h.prodId === p.id);

            let specSummary = p.specs.map(s => {
                const hasSale = s.salePrice && (!s.saleDate || today <= s.saleDate);
                return `<div class="price-tag"><span style="font-size:11px; font-weight:600;">${s.name}:</span> 
                    ${hasSale ? `<span class="origin-price">₩${s.price.toLocaleString()}</span><span class="sale-price">₩${s.salePrice.toLocaleString()}</span>` : `<span>₩${s.price.toLocaleString()}</span>`}</div>`;
            }).join('');

            dashCont.innerHTML += `<div class="item-card card" style="border-left: 5px solid ${p.priority==='必買'?'var(--pri-must)':p.priority==='需要'?'var(--pri-need)':'var(--pri-want)'}">
                <img src="${p.img || 'https://via.placeholder.com/100'}" class="prod-img">
                <div style="flex:1; min-width:0;">
                    <div style="display:flex; justify-content:space-between;"><b>${p.name}${hasHistory?'<span class="hist-tag">📉 有比價</span>':''}</b><small style="color:var(--gray)">${p.sub}</small></div>
                    ${specSummary}
                    <div style="display:flex; gap:6px; margin-top:10px;">
                        <button style="flex:1.5; background:var(--cart); color:white; border:none; border-radius:8px; height:32px;" onclick="openSelector(${p.id},'cart')">+🛒</button>
                        <button style="flex:1.5; border:1px solid #ddd; border-radius:8px; background:white;" onclick="openPlanPicker(${p.id})">+📝</button>
                        <button style="flex:1; border:1px solid #ddd; border-radius:8px; background:white; font-size:11px;" onclick="editProduct(${p.id})">編輯</button>
                    </div>
                </div></div>`;
        });
        renderCart(); renderPlans(); renderHistory();
    }

    // --- 其他原有功能函數 (全部保留) ---
    function openQuickProdPicker() {
        document.getElementById('modalOverlay').style.display = 'flex';
        document.getElementById('quickPickerModal').style.display = 'block';
        renderQuickPickerFilters(); renderQuickPickerList();
    }
    function renderQuickPickerFilters() {
        const mCont = document.getElementById('qMainFilter');
        mCont.innerHTML = ["全部", ...Object.keys(catConfig)].map(c => `<div class="filter-chip ${qActiveMain===c?'active':''}" onclick="qActiveMain='${c}'; renderQuickPickerFilters(); renderQuickPickerList();">${c}</div>`).join('');
    }
    function renderQuickPickerList() {
        const s = document.getElementById('quickSearch').value.toLowerCase();
        const cont = document.getElementById('quickPickerList');
        cont.innerHTML = db.filter(p => {
            if(qActiveMain !== "全部" && p.main !== qActiveMain) return false;
            if(s && !p.name.toLowerCase().includes(s)) return false;
            return true;
        }).map(p => `<div style="padding:12px; border-bottom:1px solid #eee;" onclick="pickQuickProd(${p.id})"><b>${p.name}</b></div>`).join('');
    }
    function pickQuickProd(pid) {
        const p = db.find(x => x.id === pid); const today = new Date().toISOString().split('T')[0];
        p.specs.forEach(s => {
            const price = (s.salePrice && (!s.saleDate || today <= s.saleDate)) ? s.salePrice : s.price;
            quickItems.push({ name: `${p.name} (${s.name})`, price: price, qty: 1 });
        });
        closeModal(); renderQuickCalc();
    }
    function addQuickManualItem() { quickItems.push({ name: "", price: 0, qty: 1 }); renderQuickCalc(); }
    function renderQuickCalc() {
        const cont = document.getElementById('quick-calc-list');
        cont.innerHTML = quickItems.map((item, idx) => `
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <input type="text" value="${item.name}" onchange="quickItems[${idx}].name=this.value" placeholder="品名" style="flex:2;">
                <input type="number" value="${item.price}" onchange="quickItems[${idx}].price=Number(this.value); renderQuickCalc();" style="flex:1;">
                <button onclick="quickItems.splice(${idx},1); renderQuickCalc();">×</button>
            </div>`).join('');
        let total = quickItems.reduce((sum, i) => sum + (i.price * i.qty), 0);
        let refund = 0; for (let i = refundTable.length - 1; i >= 0; i--) { if (total >= refundTable[i].min) { refund = refundTable[i].refund; break; } }
        document.getElementById('quick-total-won').innerText = `₩${total.toLocaleString()}`;
        document.getElementById('quick-refund-won').innerText = `₩${refund.toLocaleString()}`;
        document.getElementById('quick-final-won').innerText = (total - refund).toLocaleString();
        document.getElementById('quick-final-hkd').innerText = Math.round((total-refund) * currentRate).toLocaleString();
    }
    function clearQuickCalc() { quickItems = []; renderQuickCalc(); }

    function openSelector(pid, target, pIdx=null) {
        const p = db.find(x => x.id === pid); const today = new Date().toISOString().split('T')[0];
        modalQty = 1; document.getElementById('modalQtyDisplay').innerText = 1;
        document.getElementById('modalProdName').innerText = p.name;
        document.getElementById('modalSpecSelect').innerHTML = p.specs.map(s => `<option value="${s.specId}">${s.name}</option>`).join('');
        document.getElementById('modalOverlay').style.display = 'flex'; document.getElementById('selectorModal').style.display = 'block';
        document.getElementById('modalConfirmBtn').onclick = () => {
            const sid = Number(document.getElementById('modalSpecSelect').value);
            let list = (target==='cart') ? cart : planGroups[pIdx].items;
            let ext = list.find(x => x.prodId===pid && x.specId===sid);
            if(ext) ext.qty += modalQty; else list.push({prodId:pid, specId:sid, qty:modalQty});
            saveAndRender(); closeModal();
        };
    }

    function renderCart() {
        let total = 0; const cont = document.getElementById('cart-list'); const today = new Date().toISOString().split('T')[0];
        cont.innerHTML = '<h3>🛒 購物籃</h3>';
        cart.forEach((i, idx) => {
            const p = db.find(x => x.id === i.prodId); const s = p?.specs.find(x => x.specId === i.specId);
            const price = s ? ((s.salePrice && (!s.saleDate || today <= s.saleDate)) ? s.salePrice : s.price) : 0;
            total += price * i.qty;
            cont.innerHTML += `<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                <div><b>${p?p.name:'--'}</b><br><small>${s?s.name:'--'}</small></div>
                <div class="qty-ctrl"><button class="qty-btn" onclick="updateQty('cart', null, ${idx}, -1)">-</button><span>${i.qty}</span><button class="qty-btn" onclick="updateQty('cart', null, ${idx}, 1)">+</button></div>
                <button onclick="cart.splice(${idx},1); saveAndRender();">×</button></div>`;
        });
        let refund = 0; for (let i = refundTable.length - 1; i >= 0; i--) { if (total >= refundTable[i].min) { refund = refundTable[i].refund; break; } }
        document.getElementById('cart-total').innerText = `₩${total.toLocaleString()}`;
        document.getElementById('tax-refund-display').innerText = `退稅: ₩${refund.toLocaleString()}`;
        document.getElementById('after-refund-total').innerText = (total - refund).toLocaleString();
        document.getElementById('hkd-total').innerText = Math.round((total-refund) * currentRate).toLocaleString();
    }

    function renderPlans() {
        document.getElementById('plan-groups').innerHTML = planGroups.map((g, gi) => `
            <div class="card" style="padding:0; overflow:hidden;">
                <div style="background:#f3e5f5; padding:10px 15px; display:flex; justify-content:space-between;">
                    <b>📌 ${g.title}</b><button onclick="deletePlan(${gi})">刪除</button></div>
                <div style="padding: 10px;">${g.items.map((i, ii) => {
                    const p = db.find(x => x.id === i.prodId); const s = p?.specs.find(x => x.specId === i.specId);
                    return `<div class="card" style="display:flex; justify-content:space-between; margin-bottom:5px; box-shadow:none; border:1px solid #eee;">
                        <span>${p?p.name:'--'} (${s?s.name:'--'})</span>
                        <div class="qty-ctrl"><button class="qty-btn" onclick="updateQty('plan', ${gi}, ${ii}, -1)">-</button><span>${i.qty}</span><button class="qty-btn" onclick="updateQty('plan', ${gi}, ${ii}, 1)">+</button></div>
                    </div>`;
                }).join('')}</div></div>`).join('');
    }

    function renderHistory() {
        document.getElementById('history-list').innerHTML = historyDB.map((h, idx) => `
            <div class="card">
                <b>${h.title}</b><br><small>${h.date}</small>
                <div style="text-align:right;">實付: ₩${h.finalPaid.toLocaleString()}</div>
            </div>`).join('');
    }

    function updateQty(type, gi, ii, delta) { let list = (type === 'cart') ? cart : planGroups[gi].items; if (list[ii]) { list[ii].qty = Math.max(1, list[ii].qty + delta); saveAndRender(); } }
    function openPlanPicker(pid) {
        document.getElementById('modalOverlay').style.display='flex'; document.getElementById('planPickerModal').style.display='block';
        document.getElementById('planOptionsList').innerHTML = planGroups.map((g, gi) => `
            <div class="card" onclick="closeModal(); openSelector(${pid}, 'plan', ${gi})">${g.title}</div>`).join('');
    }
    function initFilters() {
        document.getElementById('mainTabScroll').innerHTML = ["全部", ...Object.keys(catConfig)].map(cat => `<div class="filter-chip ${cat===activeMain?'active':''}" onclick="activeMain='${cat}'; activeSub='全部'; initFilters(); render();">${cat}</div>`).join('');
        document.getElementById('priTabScroll').innerHTML = ["全部", "必買", "需要", "想買"].map(p => `<div class="filter-chip ${p===activePri?'active':''}" onclick="activePri='${p}'; initFilters(); render();">${p}</div>`).join('');
    }
    function initRegChips() {
        document.getElementById('regMainCatChips').innerHTML = Object.keys(catConfig).map(cat => `<div class="filter-chip ${cat === regActiveMain ? 'active' : ''}" onclick="regActiveMain='${cat}'; regActiveSub=catConfig['${cat}'][0]; initRegChips();">${cat}</div>`).join('');
        document.getElementById('regSubCatChips').innerHTML = catConfig[regActiveMain].map(sub => `<div class="filter-chip sub ${sub === regActiveSub ? 'active' : ''}" onclick="regActiveSub='${sub}'; initRegChips();">${sub}</div>`).join('');
        document.getElementById('regPriChips').innerHTML = ["想買", "需要", "必買"].map(p => `<div class="filter-chip ${p === regActivePri ? 'active' : ''}" onclick="regActivePri='${p}'; initRegChips();">${p}</div>`).join('');
    }
    function closeModal() { 
        document.getElementById('modalOverlay').style.display = 'none'; 
        document.querySelectorAll('.modal-content').forEach(m => m.style.display = 'none');
    }
    function saveRate() { currentRate = parseFloat(document.getElementById('rateInput').value) || 0.0058; saveAndRender(); }
    function adjModalQty(v) { modalQty = Math.max(1, modalQty + v); document.getElementById('modalQtyDisplay').innerText = modalQty; }

    function checkoutCart() {
        if(!cart.length) return; 
        const title = prompt("紀錄名稱：", "購物 " + new Date().toLocaleDateString()); if(!title) return;
        const today = new Date().toISOString().split('T')[0];
        let total = 0;
        const checkoutItems = cart.map(i => {
            const p = db.find(x => x.id === i.prodId); const s = p.specs.find(x => x.specId === i.specId);
            const pr = (s.salePrice && (!s.saleDate || today <= s.saleDate)) ? s.salePrice : s.price;
            total += pr * i.qty;
            return { name: p.name, qty: i.qty, price: pr };
        });
        let refund = 0; for (let i = refundTable.length - 1; i >= 0; i--) { if (total >= refundTable[i].min) { refund = refundTable[i].refund; break; } }
        historyDB.unshift({ id: Date.now(), title, date: new Date().toLocaleString(), items: checkoutItems, total, refund, finalPaid: total - refund });
        cart = []; saveAndRender();
    }

    if(document.getElementById('specContainer').children.length === 0) addSpecRow();
    initRegChips(); initFilters(); render();
</script>
</body>
</html>
